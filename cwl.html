<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SkW CWL — Group, Odds &amp; Next War</title>

  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SkW Family">
  <meta property="og:title" content="SkW CWL — Group, Odds & Next War">
  <meta property="og:description"
    content="Live Clan War League view for the SkW Family — group standings, promotion odds, next opponent scouting and round-by-round line-ups.">
  <meta property="og:url" content="https://skw.clashcwl.com/cwl.html">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SkW CWL — Group, Odds & Next War">
  <meta name="twitter:description"
    content="Live Clan War League view for the SkW Family — group standings, promotion odds, next opponent scouting and round-by-round line-ups.">
  <meta name="twitter:image" content="https://skw.clashcwl.com/assets/Thumbnaill.png">

  <link rel="icon" type="image/png" href="assets/Transparent_Logo.png">
  <link rel="apple-touch-icon" href="assets/Transparent_Logo.png">
  <link rel="preconnect" href="https://api.clashcwl.com">
  <link rel="preconnect" href="https://clashcwl.com">

  <style>
    :root {
      --bg: #000000;
      --panel: #0d0d0f;
      --panel-2: #16161a;
      --line: #26262c;
      --ink: #ececf0;
      --ink-dim: #9a9aa4;
      --ink-faint: #64646e;
      --accent: #5b8cff;
      --good: #35c26b;
      --warn: #e2a52c;
      --bad: #e5544b;
      --good-ink: #6fe3a0;
      --warn-ink: #f0c368;
      --bad-ink: #f28b83;
      --radius: 12px;
      --stick: 150px;
    }

    [hidden] {
      display: none !important;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Same war-base texture as lineup.html and cwl-roster.html. */
    body {
      min-height: 100dvh;
      background-image:
        linear-gradient(rgba(0, 0, 0, .6), rgba(0, 0, 0, .6)),
        url("assets/Bodybg.png"),
        url("assets/Topbg.png");
      background-repeat: repeat, repeat-y, no-repeat;
      background-position: top center, top center, top center;
      background-size: 100% auto, 100% auto, 100% auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      font-weight: 650;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 9px 14px;
      background: var(--panel-2);
      color: var(--ink);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .55;
      cursor: default;
      transform: none;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .dim {
      color: var(--ink-dim);
    }

    .faint {
      color: var(--ink-faint);
    }

    .small {
      font-size: 12px;
    }

    /* ---------- sticky top: header + clan chips (same as lineup.html) ---------- */
    header.bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header.bar .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }

    header.bar .brand img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex: none;
    }

    header.bar h1 {
      font-size: 15px;
    }

    header.bar nav.links {
      display: flex;
      gap: 4px;
    }

    header.bar nav.links a {
      font-size: 12.5px;
      color: var(--ink-dim);
      text-decoration: none;
      padding: 5px 9px;
      border-radius: 8px;
    }

    header.bar nav.links a:hover {
      color: var(--ink);
      background: var(--panel-2);
    }

    nav.chips {
      position: sticky;
      top: 52px;
      z-index: 19;
      background: var(--bg);
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 12px;
      scrollbar-width: none;
      border-bottom: 1px solid var(--line);
    }

    nav.chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 8px 13px 8px 11px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--ink-dim);
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
      background: var(--clan-color, var(--ink-faint));
    }

    .chip.active {
      background: var(--clan-color, var(--accent));
      color: #fff;
      border-color: var(--clan-color, var(--accent));
    }

    .chip.active .dot {
      background: rgba(255, 255, 255, .85);
    }

    /* Black & White's family colour is a light grey: white text on it is
       unreadable, so that one chip flips to dark ink when active. */
    .chip.active.light {
      color: #111;
    }

    .chip.active.light .dot {
      background: rgba(0, 0, 0, .55);
    }

    main {
      padding: 14px 12px 48px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ---------- clan header card (lineup.html's .clanhero) ---------- */
    .clanhero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin: 4px 2px 12px;
      position: relative;
      overflow: hidden;
    }

    .clanhero::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--clan-color, var(--accent));
    }

    .clanhero .hh {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .clanhero .cbadge {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5));
    }

    .clanhero .cdot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--clan-color, var(--accent));
      flex: none;
    }

    .clanhero .ht {
      flex: 1;
      min-width: 0;
    }

    .clanhero .cn {
      font-size: 18px;
      font-weight: 680;
    }

    .clanhero .cs {
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 1px;
    }

    .wl {
      font-size: 12px;
      font-weight: 600;
      color: var(--warn);
      border: 1px solid rgba(226, 165, 44, .4);
      border-radius: 999px;
      padding: 4px 10px;
      flex: none;
      white-space: nowrap;
    }

    .clanhero .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .clanhero .phase {
      flex: 1 1 150px;
      min-width: 0;
    }

    .clanhero .phase b {
      font-size: 14px;
      font-weight: 650;
    }

    .clanhero .phase .when {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .phase-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: 1px;
      background: var(--ink-faint);
    }

    .phase-dot.prep {
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(226, 165, 44, .15);
    }

    .phase-dot.war {
      background: var(--bad);
      box-shadow: 0 0 0 4px rgba(229, 84, 75, .15);
    }

    .phase-dot.done {
      background: var(--good);
    }

    button.refresh {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 14px;
    }

    button.refresh svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 420px) {
      button.refresh {
        padding: 10px 11px;
      }

      button.refresh .rl {
        display: none;
      }
    }

    button.refresh.busy svg {
      animation: sp .8s linear infinite;
    }

    /* ---------- jump row + sections ---------- */
    .jump {
      display: flex;
      gap: 6px;
      margin: 0 2px 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .jump::-webkit-scrollbar {
      display: none;
    }

    .jump a {
      flex: none;
      font-size: 12.5px;
      color: var(--ink-dim);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(13, 13, 15, .85);
    }

    .jump a:hover {
      color: var(--ink);
      border-color: var(--ink-faint);
    }

    section.sec {
      margin-bottom: 26px;
      scroll-margin-top: calc(var(--stick) + 10px);
    }

    .sec>h3 {
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 2px 9px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sec>h3::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--h-color, var(--ink-faint));
      flex: none;
    }

    .sec>h3 .count {
      color: var(--ink-dim);
      letter-spacing: .02em;
      text-transform: none;
    }

    .sec>h3 .aside {
      margin-left: auto;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
    }

    .sec .lede {
      font-size: 12.5px;
      color: var(--ink-dim);
      margin: -3px 2px 11px;
      max-width: 72ch;
    }

    .box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .box+.box {
      margin-top: 9px;
    }

    .note {
      color: var(--ink-faint);
      font-size: 12.5px;
      padding: 14px;
      text-align: center;
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .err-box {
      border-left: 3px solid var(--bad);
    }

    .err-box b {
      color: var(--bad-ink);
    }

    /* ---------- pills / badges ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      color: var(--ink-dim);
      flex: none;
      white-space: nowrap;
    }

    .pill.th {
      background: var(--panel-2);
      border: 0;
      padding: 3px 8px;
      font-weight: 650;
      color: var(--ink-dim);
    }

    .pill.us {
      color: #fff;
      border: 0;
      font-weight: 700;
      background: var(--clan-color, var(--accent));
      padding: 2px 8px;
    }

    .pill.us.light {
      color: #111;
    }

    .tone-good {
      color: var(--good-ink);
    }

    .tone-warn {
      color: var(--warn-ink);
    }

    .tone-bad {
      color: var(--bad-ink);
    }

    .pill.v {
      border: 0;
      font-weight: 650;
      padding: 3px 9px;
    }

    .pill.v.tone-good {
      background: rgba(53, 194, 107, .16);
    }

    .pill.v.tone-warn {
      background: rgba(226, 165, 44, .16);
    }

    .pill.v.tone-bad {
      background: rgba(229, 84, 75, .16);
    }

    .lg {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
    }

    .lg img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex: none;
    }

    .mixes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mchip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px 4px 7px;
      color: var(--ink);
    }

    .mchip img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .mchip .x {
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
    }

    .mchip.th {
      padding-left: 10px;
    }

    .mchip.th b {
      color: var(--warn-ink);
      font-weight: 700;
    }

    /* ---------- skeletons ---------- */
    .sk {
      position: relative;
      overflow: hidden;
      background: var(--panel-2);
      border-radius: 8px;
    }

    .sk::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .05), transparent);
      animation: shimmer 1.3s infinite;
    }

    @keyframes shimmer {
      to {
        transform: translateX(100%);
      }
    }

    .sk-line {
      height: 12px;
      margin: 8px 0;
    }

    .sk-block {
      height: 64px;
      margin-bottom: 9px;
      border-radius: var(--radius);
    }

    .spin {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: sp .7s linear infinite;
      vertical-align: -2px;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg);
      }
    }

    .loadline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--ink-dim);
      margin: 0 2px 10px;
    }

    /* ---------- next war ---------- */
    .nw-head {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nw-badge {
      width: 60px;
      height: 60px;
      object-fit: contain;
      flex: none;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .6));
    }

    .nw-id {
      flex: 1 1 200px;
      min-width: 0;
    }

    .nw-kicker {
      font-size: 11px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .nw-name {
      font-size: 22px;
      font-weight: 720;
      line-height: 1.2;
      margin: 2px 0;
      overflow-wrap: anywhere;
    }

    .nw-timer {
      text-align: right;
      flex: none;
    }

    .nw-timer .lbl {
      font-size: 12px;
      color: var(--ink-dim);
    }

    .nw-clock {
      font-size: 26px;
      font-weight: 760;
      color: var(--warn);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.01em;
    }

    .nw-clock.war {
      color: var(--bad-ink);
    }

    @media (max-width: 559px) {
      .nw-timer {
        flex-basis: 100%;
        text-align: left;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .nw-clock {
        font-size: 22px;
      }
    }

    .nw-mix {
      margin-top: 14px;
    }

    .cc-call {
      background: linear-gradient(180deg, rgba(91, 140, 255, .09), rgba(91, 140, 255, .02));
      border: 1px solid rgba(91, 140, 255, .32);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 9px;
    }

    .cc-call .k {
      font-size: 11px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #a9c4ff;
      font-weight: 650;
    }

    .cc-call .t {
      font-size: 16px;
      font-weight: 680;
      margin-top: 4px;
    }

    .cc-call .why {
      font-size: 12.5px;
      color: var(--ink-dim);
      margin-top: 6px;
    }

    .cc-tiles {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .cc-tile {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px 6px 6px;
    }

    .cc-tile img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .cc-tile .n {
      font-size: 15px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .cc-tile .nm {
      font-size: 11.5px;
      color: var(--ink-dim);
      line-height: 1.15;
    }

    .cc-tile.filler {
      opacity: .7;
    }

    .lean {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .lean .txt {
      flex: 1;
      min-width: 0;
    }

    .lean .txt strong {
      font-weight: 700;
    }

    .lean .cav {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 3px;
    }

    .split {
      margin-top: 12px;
    }

    .split .bar {
      display: flex;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--panel-2);
    }

    .split .bar .g {
      background: #c9894a;
    }

    .split .bar .a {
      background: #5bb7ff;
    }

    .split .legend {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .split .legend i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 5px;
    }

    .boxhead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .boxhead b {
      font-size: 14px;
      font-weight: 650;
    }

    .strats {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0;
    }

    .strats li {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .strats li:last-child {
      border-bottom: 0;
    }

    .strats .n {
      font-size: 17px;
      font-weight: 760;
      color: var(--warn);
      width: 22px;
      text-align: right;
      flex: none;
      font-variant-numeric: tabular-nums;
    }

    .strats .s {
      font-weight: 620;
    }

    .strats .d {
      font-size: 12px;
      color: var(--ink-dim);
    }

    /* ---------- collapsibles ---------- */
    details.fold {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-top: 9px;
    }

    details.fold>summary {
      list-style: none;
      cursor: pointer;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    details.fold>summary::-webkit-details-marker {
      display: none;
    }

    details.fold>summary::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--ink-faint);
      border-bottom: 2px solid var(--ink-faint);
      transform: rotate(-45deg);
      margin-left: auto;
      flex: none;
      transition: transform .15s;
    }

    details.fold[open]>summary::after {
      transform: rotate(45deg);
    }

    details.fold>summary .st {
      font-weight: 650;
    }

    details.fold>summary .ss {
      font-size: 12px;
      color: var(--ink-dim);
    }

    details.fold>.in {
      padding: 0 14px 14px;
    }

    details.fold details.fold {
      background: var(--panel-2);
    }

    /* ---------- player rows (army cards, rosters, line-ups) ---------- */
    ul.rows {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 7px;
    }

    a.gamelink::after {

    /* army tiles */
    .army {

    .aline {

    }

    .at {
      position: relative;
      width: 34px;
      height: 34px;

      height: 100%;

      padding: 2px;

    .ccbox .lbl {
      font-size: 9.5px;
      font-weight: 750;
      color: #a9c4ff;

      padding: 0 1px;

    .hgroup {
      display: inline-flex;
      gap: 3px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(0, 0, 0, .25);
    }

    .hgroup .at {
      border: 0;
      background: transparent;
    }

    .hgroup .at.face {
      background: rgba(255, 255, 255, .04);
    }

    /* ---------- group table ---------- */
    .seg {
      display: flex;
      gap: 6px;
      margin: 0 2px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .seg::-webkit-scrollbar {
      display: none;
    }

    .seg button {
      flex: none;
      padding: 6px 12px;
      font-size: 12.5px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink-dim);
    }

    .seg button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .bands {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-dim);
      margin: 0 2px 10px;
    }

    .bands i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .ghead {
      display: none;
    }

    ul.glist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    li.gitem {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    li.gitem::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--slot-color, transparent);

    li.gitem.promote {
      --slot-color: var(--good);
    }

    li.gitem.demote {
      --slot-color: var(--bad);
    }

    li.gitem.us {
      border-color: color-mix(in srgb, var(--clan-color) 55%, var(--line));
      background: color-mix(in srgb, var(--clan-color) 7%, var(--panel));
    }

    .grow {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      grid-template-areas:
        "seed clan str"
        "seed stats stats";
      gap: 4px 10px;
      padding: 12px 12px 12px 14px;
      cursor: pointer;
      align-items: center;
    }

    .grow:hover {
      background: rgba(255, 255, 255, .015);
    }

    .grow .seed {
      grid-area: seed;
      align-self: start;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-dim);
      text-align: center;
      padding-top: 9px;
      font-variant-numeric: tabular-nums;
    }

    .grow .clan {
      grid-area: clan;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .grow .clan img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex: none;
    }

    .grow .clan .nm {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .grow .clan .nm b {
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grow .clan .cs {
      font-size: 12px;
      color: var(--ink-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grow .str {
      grid-area: str;
      text-align: right;
      min-width: 58px;
    }

    .grow .str .v {
      font-size: 19px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .grow .str .bar {
      height: 4px;
      border-radius: 999px;
      background: var(--panel-2);
      margin-top: 5px;
      overflow: hidden;
    }

    .grow .str .bar>span {
      display: block;
      height: 100%;
      border-radius: 999px;
    }

    .grow .str .k {
      font-size: 10px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .grow .stats {
      grid-area: stats;
      display: flex;
      gap: 6px 14px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--ink-dim);
      margin-top: 4px;
    }

    .grow .stats .s {
      display: inline-flex;
      gap: 5px;
      align-items: baseline;
    }

    .grow .stats .s i {
      font-style: normal;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-faint);
    }

    .grow .stats .s b {
      color: var(--ink);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .grow .stats .s b.gold {
      color: var(--warn-ink);
    }

    .grow .stats .s .of {
      color: var(--ink-faint);
      font-size: 11px;
    }

    .grow .caret {
      display: none;
    }

    @media (max-width: 759px) {
      .glist.nostats .grow .stats {
        display: none;
      }
    }

    .gdetail {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 18px;
    }

    .gdetail h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
      margin-bottom: 10px;
      font-weight: 650;
    }

    .bd {
      margin-bottom: 11px;
    }

    .bd .l {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
    }

    .bd .l b {
      font-weight: 650;
    }

    .bd .l .p {
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bd .dt {
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 1px;
    }

    .track {
      height: 6px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 5px;
    }

    .track>span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .fineprint {
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 10px;
      line-height: 1.5;
    }

    .roster {
      max-height: 420px;
      overflow-y: auto;
      padding-right: 2px;
    }

    @media (min-width: 760px) {
      .ghead {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) 88px 98px 92px 86px 108px 18px;
        gap: 10px;
        padding: 0 12px 7px 14px;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: var(--ink-faint);
      }

      .ghead span:nth-child(n+3) {
        text-align: right;
      }

      .grow {
        grid-template-columns: 30px minmax(0, 1fr) 88px 98px 92px 86px 108px 18px;
        grid-template-areas: none;
        gap: 10px;
      }

      .grow .seed,
      .grow .clan,
      .grow .str {
        grid-area: auto;
      }

      .grow .seed {
        padding-top: 0;
        align-self: center;
      }

      .grow .stats {
        display: contents;
      }

      .grow .stats .s {
        display: block;
        text-align: right;
        font-size: 13px;
      }

      .grow .stats .s i {
        display: none;
      }

      .grow .str {
        order: 9;
      }

      .grow .caret {
        display: block;
        order: 10;
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--ink-faint);
        border-bottom: 2px solid var(--ink-faint);
        transform: rotate(-45deg);
        transition: transform .15s;
        justify-self: center;
      }

      li.gitem.open .grow .caret {
        transform: rotate(45deg);
      }

      .gdetail {
        grid-template-columns: 1fr 1.25fr;
        gap: 26px;
      }
    }

    /* ---------- outlook ---------- */
    .tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .tile {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 14px;
    }

    .tile .sl {
      font-size: 11.5px;
      color: var(--ink-dim);
    }

    .tile .sv {
      font-size: 28px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      line-height: 1.15;
      margin-top: 3px;
    }

    .tile .sv small {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-faint);
      letter-spacing: 0;
    }

    .tile .track {
      height: 5px;
      margin-top: 9px;
    }

    .tile.hero {
      grid-column: 1 / -1;
    }

    .tile.hero .sv {
      font-size: 40px;
    }

    .tile.diff {
      grid-column: 1 / -1;
      border-left: 3px solid var(--d-color, var(--ink-faint));
    }

    .tile.diff .dv {
      font-size: 24px;
      font-weight: 760;
      color: var(--d-color);
      margin: 3px 0 4px;
      line-height: 1.15;
    }

    .tile.diff .dn {
      font-size: 13px;
      color: var(--ink-dim);
    }

    .tiles.n3 .tile:last-child {
      grid-column: 1 / -1;
    }

    .h2h .prow .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .h2h .prow .sv {
      font-weight: 750;
      font-size: 15px;
      min-width: 26px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    @media (min-width: 760px) {
      .tiles {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .tile.hero {
        grid-column: span 4;
      }

      .tile.diff {
        grid-column: span 2;
      }

      .tiles.n2 .tile:not(.hero):not(.diff) {
        grid-column: span 3;
      }

      .tiles.n3 .tile:not(.hero):not(.diff),
      .tiles.n3 .tile:last-child {
        grid-column: span 2;
      }
    }

    /* ---------- round history ---------- */
    .rh-meta {
      font-size: 12.5px;
      color: var(--ink-dim);
      margin: 10px 0;
    }

    .rh-meta b.gold {
      color: var(--warn-ink);
    }

    .rd-sum {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .rd-sum .vs {
      font-size: 12px;
      color: var(--ink-dim);
    }

    .res {
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .res.w {
      background: rgba(53, 194, 107, .16);
      color: var(--good-ink);
    }

    .res.l {
      background: rgba(229, 84, 75, .16);
      color: var(--bad-ink);
    }

    .res.p {
      background: rgba(226, 165, 44, .16);
      color: var(--warn-ink);
    }

    .res.d {
      background: var(--panel-2);
      color: var(--ink-dim);
    }

    .stars {
      color: var(--warn-ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .gate {
      max-width: 440px;
      margin: 48px auto 0;
      text-align: center;
      padding: 28px 22px;
    }

    .gate .lock {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .gate .lock svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--ink-dim);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gate h2 {
      font-size: 18px;
    }

    .gate p {
      font-size: 13px;
      color: var(--ink-dim);
      margin: 8px 0 18px;
    }

    .gate a.signin,
    .gate button.signin {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 650;
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 10px;
      border: 0;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
      padding: 6px 12px 30px;
      line-height: 1.7;
    }

    footer a {
      color: var(--ink-dim);
    }

    .fade-in {
      animation: fadein .25s ease-out;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    (function () {

        { key: "sumkindofbeauty", name: "SumKindOfBeauty", tag: "#2R0CPQCGV", color: "#e0669e",
