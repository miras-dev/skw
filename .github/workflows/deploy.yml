# Deploys cwl-roster.html to skw.clashcwl.com on every push to main.
#
# Requires (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN   arn:aws:iam::<ACCOUNT_ID>:role/skw-roster-deploy
#   AWS_REGION     us-east-1                (any region; S3/CloudFront calls are global-ish)
#   S3_BUCKET      skw.clashcwl.com
#   CF_DIST_ID     <DIST_ID>
#
# No long-lived AWS keys: auth is GitHub OIDC → the IAM role's trust policy.

name: Deploy skw.clashcwl.com

on:
  push:
    branches: [main]
    paths:
      - "cwl-roster.html"
      - "lineup.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}          # lets you trigger a redeploy by hand

concurrency:
  group: deploy-skw
  cancel-in-progress: true

permissions:
  id-token: write               # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload site to S3
        run: |
          aws s3 cp cwl-roster.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300, must-revalidate"
          aws s3 cp lineup.html "s3://${{ vars.S3_BUCKET }}/lineup.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DIST_ID }}" \
            --paths "/index.html" "/" "/lineup.html" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation: $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CF_DIST_ID }}" --id "$ID"

      - name: Done
        run: echo "https://skw.clashcwl.com deployed."
