          track.appendChild(el("div", { class: "pi-chart-col" }, [bars, el("div", { class: "pi-chart-lbl", text: b.label })]));
        });
        return track;
      }
      function piChartSection(buckets, sectionKey) {
        var wrap = el("div");
        if (!buckets.length) return wrap;
        var metric = piChartMetric[sectionKey] || "stars";
        var toggle = el("div", { class: "pi-tabs" });
        [["stars", "Average stars"], ["destr", "Average destruction"]].forEach(function (pair) {
          var b = el("button", { class: "pi-tab" + (pair[0] === metric ? " active" : ""), text: pair[1] });
          b.addEventListener("click", function () {
            piChartMetric[sectionKey] = pair[0];
            var cached = piCache[piTag];
            if (cached) renderPiTab(cached);
          });
          toggle.appendChild(b);
        });
        wrap.appendChild(toggle);
        wrap.appendChild(piChartLegend());
        wrap.appendChild(piChartBars(buckets, metric));
        return wrap;
      }

      function piOverview(entry, r) {
        var wrap = el("div");
        wrap.appendChild(el("div", { class: "pi-head" }, [
          el("div", { style: "font-weight:700;font-size:16px", text: (r && r.name) || "Player" }),
          el("div", { class: "tag", text: entry.tag })
        ]));

        var known = el("div", { class: "pi-sgrid" });
        if (r && r.th) known.appendChild(piStat("Town hall", "TH" + r.th));
        if (r && r.league) known.appendChild(piStat("League", r.league));
        if (r && r.heroSum) known.appendChild(piStat("Hero Σ", String(r.heroSum)));
        if (r && r.rankedScore !== "" && r.rankedScore != null) known.appendChild(piStat("Ranked score", String(r.rankedScore)));
        if (known.children.length) wrap.appendChild(known);

        var w = flattenWar(entry.war), c = flattenCwl(entry.cwl), wa = aggAttacks(w.attacks);
        var totals = el("div", { class: "pi-sgrid" });
        totals.appendChild(piStat("Wars played", entry.war ? String(w.warsPlayed) : "—"));
        totals.appendChild(piStat("CWL seasons", entry.cwl ? String(c.seasons) : "—"));
        totals.appendChild(piStat("CWL attacks missed", entry.cwl ? String(c.missed) : "—"));
        totals.appendChild(piStat("Avg war stars", w.attacks.length ? wa.avgStars.toFixed(2) : "—"));
        wrap.appendChild(totals);

        if (entry.clans && entry.clans.length) {
          wrap.appendChild(el("div", { class: "pi-section-title", text: "Time in recent clans (all time)" }));
          var max = Math.max.apply(null, entry.clans.map(function (x) { return Number(x.minutes) || 0; }).concat([1]));
          entry.clans.slice(0, 5).forEach(function (x) {
            var name = (x.clan && x.clan.name) || x.name || "?";
            wrap.appendChild(piBar(name, fmtMinutes(x.minutes), Number(x.minutes) || 0, max));
          });
        }

        if (!entry.war && !entry.cwl && !entry.clans) {
          wrap.appendChild(el("div", { class: "pi-empty", text: "Couldn't load historical stats for this player right now — try again in a bit." }));
        }
        return wrap;
      }

      function piWar(entry) {
        var wrap = el("div");
        if (!entry.war) { wrap.appendChild(el("div", { class: "pi-empty", text: "War history unavailable right now." })); return wrap; }
        var w = flattenWar(entry.war), a = aggAttacks(w.attacks), d = aggAttacks(w.defenses);
        var allowed = entry.war.reduce(function (sum, item) { return sum + (Number(item.attacksPerMember) || 1); }, 0);
        var thAtk = avgThDiff(w.attacks, function (x) { return x.__ownTH; }, warOppTH);
        var thDef = avgThDiff(w.defenses, function (x) { return x.__ownTH; }, warOppTH);

        wrap.appendChild(piStatGrid([piStatCell("Wars played", piStatVal(String(w.warsPlayed)), true)]));
        wrap.appendChild(piStatGrid([
          piStatCell("Attacks used", piStatVal(a.n + "/" + allowed)),
          piStatCell("Average stars", piStatPair(a.avgStars.toFixed(2), d.avgStars.toFixed(2))),
          piStatCell("Average destruction", piStatPair(a.avgDestr.toFixed(2), d.avgDestr.toFixed(2))),
          piStatCell("Average attack duration", piStatPair(fmtDur(a.avgDur), fmtDur(d.avgDur))),
          piStatCell("Average Town Hall difference",
            piStatPair(thAtk != null ? thAtk.toFixed(2) : "—", thDef != null ? thDef.toFixed(2) : "—"), true)
        ]));

        wrap.appendChild(el("div", { class: "pi-section-title", text: "Attack star distribution" }));
        ["0★", "1★", "2★", "3★"].forEach(function (lab, i) {
          var pctv = a.n ? Math.round((a.buckets[i] / a.n) * 100) : 0;
          wrap.appendChild(piBar(lab, a.buckets[i] + " (" + pctv + "%)", a.buckets[i], a.n));
        });

        wrap.appendChild(el("div", { class: "pi-section-title", text: "Monthly trend" }));
        wrap.appendChild(piChartSection(buildWarMonthlyBuckets(entry.war), "war"));
        return wrap;
      }

      function piCwl(entry) {
        var wrap = el("div");
        if (!entry.cwl) { wrap.appendChild(el("div", { class: "pi-empty", text: "CWL history unavailable right now." })); return wrap; }
        ensureCwlDefenses(entry);
        var c = flattenCwl(entry.cwl), a = aggAttacks(c.attacks);
        var defList = flattenCwlDefenses(entry), d = aggAttacks(defList);
        var loaded = entry.cwlDefState === "loaded";
        var used = a.n, allowed = a.n + c.missed;
        var thAtk = avgThDiff(c.attacks, function (x) { return x.__ownTH; }, cwlOppTH);
        var thDef = loaded ? avgThDiff(defList, function (x) { return x.myTH; }, function (x) { return x.attackerTH; }) : null;
        var pending = loaded ? "—" : "…";

        wrap.appendChild(piStatGrid([piStatCell("CWL seasons played", piStatVal(String(c.seasons)), true)]));
        wrap.appendChild(piStatGrid([
          piStatCell("Attacks used", piStatVal(used + "/" + allowed)),
          piStatCell("Average stars", piStatPair(a.avgStars.toFixed(2), loaded ? d.avgStars.toFixed(2) : pending)),
          piStatCell("Average destruction", piStatPair(a.avgDestr.toFixed(2), loaded ? d.avgDestr.toFixed(2) : pending)),
          piStatCell("Average attack duration", piStatPair(fmtDur(a.avgDur), loaded ? fmtDur(d.avgDur) : pending)),
          piStatCell("Average Town Hall difference",
            piStatPair(thAtk != null ? thAtk.toFixed(2) : "—", thDef != null ? thDef.toFixed(2) : pending), true)
        ]));

        if (!loaded) {
          wrap.appendChild(el("div", { class: "pi-empty", text: "loading defense stats from full CWL war data…" }));
        } else if (entry.cwlDefenseCapped) {
          wrap.appendChild(el("div", {
            class: "pi-empty",
            text: "defense stats cover the most recent " + CWL_DEFENSE_SEASON_CAP + " seasons — attack-side totals above still cover all " + c.seasons + "."
          }));
        }

        wrap.appendChild(el("div", { class: "pi-section-title", text: "By season" }));
        wrap.appendChild(piChartSection(buildCwlSeasonBuckets(entry.cwl, entry.cwlDefenses), "cwl"));

        if (entry.cwl.length) {
          wrap.appendChild(el("div", { class: "pi-section-title", text: "Season by season" }));
          entry.cwl.slice().reverse().forEach(function (s) {
            var clanName2 = (s.clan && s.clan.name) || "?";
            var stars = (s.attacks || []).reduce(function (sum, at) { return sum + (Number(at.stars) || 0); }, 0);
            // One attack per round in CWL, so rounds played = attacks + missed.
            // Total rounds = the clan's won/lost/tied for that season (7 in a normal
            // 8-clan group; fewer while a season is still running).
            var missed = Number(s.missedAttacks) || 0;
            var played = (s.attacks || []).length + missed;
            var cw = s.clan && s.clan.wars;
            var rounds = cw ? (Number(cw.won) || 0) + (Number(cw.lost) || 0) + (Number(cw.tied) || 0) : 0;
            wrap.appendChild(el("div", { class: "pi-row" }, [
              el("span", { text: (s.season || "season") + " · " + clanName2 }),
              el("span", { class: "d", text: stars + "★ · " + played + "/" + (rounds || 7) + " rounds · " + missed + " missed" })
            ]));
          });
        }
        return wrap;
      }

      function piClans(entry) {
        var wrap = el("div");
        if (!entry.clans || !entry.clans.length) { wrap.appendChild(el("div", { class: "pi-empty", text: "Clan history unavailable right now." })); return wrap; }
        wrap.appendChild(el("div", { class: "pi-section-title", text: "Time spent per clan (all time)" }));
        var max = Math.max.apply(null, entry.clans.map(function (x) { return Number(x.minutes) || 0; }).concat([1]));
        entry.clans.forEach(function (x) {
          var name = (x.clan && x.clan.name) || x.name || "?";
          wrap.appendChild(piBar(name, fmtMinutes(x.minutes), Number(x.minutes) || 0, max));
        });
        return wrap;
      }

      function formatTime_(d) {
        var t = parseTime(d);   // battlelog times are CoC-style "20260923T101010.000Z"
        if (!t) return "—";
        var diff = Date.now() - t.getTime();
        var mins = Math.floor(diff / 60000);
        var hours = Math.floor(mins / 60);
        var days = Math.floor(hours / 24);
        if (mins < 1) return "just now";
        if (mins < 60) return mins + "m ago";
        if (hours < 24) return hours + "h ago";
        if (days < 7) return days + "d ago";
        return t.toISOString().slice(0, 10);
      }
      function piRanked(entry) {
        var wrap = el("div");
        if (!entry.ranked || !entry.ranked.length) { wrap.appendChild(el("div", { class: "pi-empty", text: "Ranked battle history unavailable." })); return wrap; }

        var attacks = entry.ranked.filter(function (a) { return a.attack === true; });
        var defenses = entry.ranked.filter(function (a) { return a.attack === false; });

        if (attacks.length > 0) {
          wrap.appendChild(el("div", { class: "pi-section-title", text: "Attacks " + attacks.length }));
          attacks.forEach(function (a, i) {
            var stars = Number(a.stars) || 0;
            var destr = Number(a.destructionPercentage) || 0;
            var starIcon = "★".repeat(Math.max(0, Math.min(3, stars))) + "☆".repeat(Math.max(0, 3 - stars));
            wrap.appendChild(el("div", { class: "pi-row" }, [
              el("span", { text: starIcon + " " + destr.toFixed(0) + "%" }),
              el("span", { class: "d", text: formatTime_(a.battleTimestamp) })
            ]));
          });
        }

        if (defenses.length > 0) {
          wrap.appendChild(el("div", { class: "pi-section-title", text: "Defenses " + defenses.length }));
          defenses.forEach(function (a, i) {
            var stars = Number(a.stars) || 0;
            var destr = Number(a.destructionPercentage) || 0;
            var starIcon = "★".repeat(Math.max(0, Math.min(3, stars))) + "☆".repeat(Math.max(0, 3 - stars));
            wrap.appendChild(el("div", { class: "pi-row" }, [
              el("span", { text: starIcon + " " + destr.toFixed(0) + "%" }),
              el("span", { class: "d", text: formatTime_(a.battleTimestamp) })
            ]));
          });
        }

        return wrap;
      }

      /* -------- sheet plumbing -------- */
      function openSheet(sel) {
        $("#backdrop").classList.add("open");
        $(sel).classList.add("open");
      }
      function closeSheets() {
        $("#backdrop").classList.remove("open");
        $$(".sheet").forEach(function (s) { s.classList.remove("open"); });
      }
      $("#backdrop").addEventListener("click", closeSheets);
      $("#piClose").addEventListener("click", closeSheets);

      load();
      setInterval(load, 30000);
    })();
  </script>
</body>

</html>
